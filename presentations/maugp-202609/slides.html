<h1 id="punkt-wyj%C5%9Bcia">Punkt wyjścia</h1>
<ul>
<li>Platforma używana wewnątrz dużej firmy, używana przez setki wewnętrznych klientów</li>
<li><strong>Dziś: brak planu DR, brak polityki DR</strong></li>
<li>Wcześniejsza próba zaplanowania DR - utknęła przy oszacowanych kosztach</li>
<li>Postanowiłem policzyć wszystko od nowa, z realnych danych, zero zgadywania</li>
</ul>
<blockquote>
<p>Zasada, którą trzymałem się przez cały projekt: <strong>measure, don't assume</strong></p>
</blockquote>

<h1 id="gdzie-faktycznie-jest-luka">Gdzie faktycznie jest luka</h1>
<p>Wszystkie magazyny: <strong>ZRS, jeden region</strong></p>
<ul>
<li>Awaria strefy dostępności (AZ) — <strong>już obsłużona</strong> (ZRS + klaster rozłożony na 3 strefy)</li>
<li>Awaria całego regionu — <strong>nic dziś tego nie przetrwa</strong></li>
</ul>
<p>Co konkretnie znaczy &quot;brak DR&quot;: nie brak jakiejkolwiek odporności, tylko brak <strong>odporności na outage całego regionu</strong>.</p>
<p>Cel: <strong>RTO 8h, RPO 4h</strong> (wszystkie dane jednolicie)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="meme" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="meme" data-marpit-pagination="7" style="--paginate:true;--class:meme;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34"><img src="meme-1.jpeg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="section" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="section" data-marpit-pagination="8" style="--paginate:true;--class:section;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="krok-1-najprostsza-odpowied%C5%BA-na-papierze">Krok 1: najprostsza odpowiedź na papierze</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="w%C5%82%C4%85czam-gzrs-wsz%C4%99dzie">Włączam GZRS wszędzie</h1>
<p>Najprostsze rozwiązanie: zamienić ZRS na GZRS (Azure sam replikuje dane do drugiego regionu).</p>
<table>
<thead>
<tr>
<th></th>
<th>ZRS (dziś)</th>
<th>GZRS</th>
<th>Różnica</th>
</tr>
</thead>
<tbody>
<tr>
<td>Logi (Storage A)</td>
<td>9 939,83 $</td>
<td>~17 830,33 $</td>
<td>+7 890,50 $</td>
</tr>
<tr>
<td>Logi (Storage B)</td>
<td>1 548,95 $</td>
<td>~2 779,28 $</td>
<td>+1 230,33 $</td>
</tr>
<tr>
<td>Metryki (Storage C)</td>
<td>2 219,76 $</td>
<td>~3 024,98 $</td>
<td>+805,23 $</td>
</tr>
<tr>
<td><strong>Razem</strong></td>
<td><strong>13 708,54 $</strong></td>
<td><strong>~23 634,59 $</strong></td>
<td><strong>+9 926,06 $/mies.</strong></td>
</tr>
</tbody>
</table>
<p>W relacji do całego budżetu infrastruktury, koszt storage <strong>to tylko ~10%.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="section" data-marpit-pagination="10" style="--paginate:true;--class:section;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="krok-2-prawdziwe-pytanie--jak-wgra%C4%87-dane-kt%C3%B3re-ju%C5%BC-tam-le%C5%BC%C4%85">Krok 2: prawdziwe pytanie — jak wgrać dane, które już tam leżą?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="punkt-startowy-150-mln-obiekt%C3%B3w-700-tb">Punkt startowy: ~150 mln obiektów, ~700 TB</h1>
<p>GZRS/replikacja obsługuje <strong>nowe zapisy na bieżąco</strong>. Nie odpowiada na pytanie:</p>
<blockquote>
<p>Jak przenieść dane, które już dziś leżą w Storage Account, zanim replikacja w ogóle zacznie działać?</p>
</blockquote>
<p>Naturalny kandydat: <strong>natywny backfill Azure Object Replication</strong> (&quot;skopiuj istniejące obiekty&quot;).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="metodologia-liczba-obiekt%C3%B3w-i-rozmiar-obiekt%C3%B3w-testowane-osobno">Metodologia: liczba obiektów i rozmiar obiektów testowane osobno</h1>
<p>Dla backfillu ~150 mln obiektów wąskim gardłem może być albo koszt pojedynczego wywołania API (dużo małych obiektów), albo surowa przepustowość sieci (duże obiekty):</p>
<ul>
<li><strong>Seria liczby obiektów</strong> (&quot;count&quot;): małe, płaskie obiekty 20KB, w zakresie liczności 172 → 1 720 → 17 204 (skala 100x) — sprawdza, czy przepustowość trzyma się przy większej skali.</li>
<li><strong>Jednorazowy test realistycznego rozmiaru</strong> (&quot;realistic&quot;): stała, umiarkowana liczba (500) obiektów o rozmiarach jak prawdziwe segmenty w platformie (86% ~2MB, 14% ~72MB, średnia ~11,7MB).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="pomiar-1-natywny-backfill-object-replication">Pomiar 1: natywny backfill Object Replication</h1>
<table>
<thead>
<tr>
<th>Test</th>
<th>Obiekty</th>
<th>Przepustowość</th>
</tr>
</thead>
<tbody>
<tr>
<td>Seria liczby obiektów</td>
<td>172 → 17 204</td>
<td>0,49 → 56,59 obj/s</td>
</tr>
<tr>
<td>Realistyczny rozmiar (500 obiektów, ~11,7MB śr.)</td>
<td>500</td>
<td>10,59 MB/s</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="pomiar-1-pe%C5%82na-skala">Pomiar 1: pełna skala</h1>
<p>Ekstrapolując do pełnej skali (~150M obiektów, ~1 755 TB):</p>
<ul>
<li>Ograniczenie liczbą obiektów: <strong>~31 dni</strong></li>
<li>Ograniczenie przepustowością (bajty): <strong>~46 019 h ≈ 5,25 roku</strong></li>
</ul>
<p><strong>Wiążące ograniczenie to zawsze większa z tych dwóch liczb: 5,25 roku.</strong></p>
<p>Natywny backfill - nie przejdzie.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="meme" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="meme" data-marpit-pagination="15" style="--paginate:true;--class:meme;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34"><img src="meme-2.jpeg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="pomiar-2-azcopy-zamiast-natywnego-backfillu">Pomiar 2: azcopy zamiast natywnego backfillu</h1>
<p>Ten sam test, narzędziem <code>azcopy</code> (masowe kopiowanie równoległe):</p>

<p>Realna poprawa (2,6×–20,1× względem Object Replication), ale wciąż <strong>tygodnie, nie godziny</strong>.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="pomiar-3-azcopy-po-dostrojeniu">Pomiar 3: <code>azcopy</code> po &quot;dostrojeniu&quot;</h1>

<p>To poprawa dla limitu liczbą obiektów. Realistyczne dane (większe obiekty) mają inne ograniczenie — przepustowość, nie liczbę operacji.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="pomiar-4-r%C3%B3wnoleg%C5%82e-azcopy">Pomiar 4: równoległe <code>azcopy</code></h1>
<p><strong>4 równoległe procesy to najlepszy zmierzony punkt.</strong> dla 8 procesów — to potwierdzony (dwukrotnie) spadek wydajności: wspólne ograniczenie sieci/konta zaczyna dominować.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="wynik-ko%C5%84cowy-od-525-roku-do-27-dni">Wynik końcowy: od 5,25 roku do 27 dni</h1>
<table>
<thead>
<tr>
<th>Etap</th>
<th>Ograniczenie (bajty)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Object Replication, natywny backfill</td>
<td>~5,25 roku</td>
</tr>
<tr>
<td>azcopy, ustawienia domyślne</td>
<td>~95 dni</td>
</tr>
<tr>
<td>azcopy, dostosowanie współbieżności</td>
<td>(dotyczy liczby obiektów)</td>
</tr>
<tr>
<td>azcopy, 4 procesy równolegle, realistyczne dane</td>
<td><strong>~27 dni</strong></td>
</tr>
</tbody>
</table>
<p><strong>Poprawa 71×</strong> — z pomiarów, nie z założeń.</p>
<p>To wciąż nie jest operacja &quot;jednego dnia&quot; - ale to jednorazowy koszt uruchomienia DR, nie koszt każdego failoveru.</p>
<p>Koszt samych testów w Azure, jaki zapłaciłem za cały cykl pomiarowy: <strong>5,89 $</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="section" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="section" data-marpit-pagination="22" style="--paginate:true;--class:section;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="krok-3-jak-zaprojektowa%C4%87-replikacj%C4%99-%C5%BCeby-by%C5%82a-tania-na-co-dzie%C5%84">Krok 3: jak zaprojektować replikację, żeby była tania na co dzień</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="aktywny-pasywny-model-z-warstwowaniem">Aktywny-pasywny model z warstwowaniem</h1>
<p><strong>Aktywny-pasywny</strong> wygrywa z aktywnym-aktywnym: region podstawowy zostaje w warstwie <strong>Hot</strong> (bez wpływu na wydajność zapytań), region zapasowy w warstwie <strong>Cool/Cold</strong> — &quot;podgrzewam&quot; do Hot dopiero przy realnym failowerze.</p>
<p>To wymaga <strong>Azure Object Replication</strong> (nie natywnego GZRS): GZRS replikuje blob wraz z jego warstwą — nie da się mieć &quot;Hot w regionie A, Cold w regionie B&quot; jednym kontem GZRS. Object Replication to dwa osobne konta, każde z własną polityką na tiering obiektów.</p>
<p><strong>Mała uwaga</strong> — backfill Object Replication - dogranie 150M <em>już istniejących</em> obiektów - zbyt wolne. Tutaj Object Replication odpowiada tylko za replikację <em>nowych, bieżących zapisów</em> — małych, ciągłych porcji danych, a nie jednorazowego catch-upu. <code>azcopy</code> robi jednorazową repliację, Object Replication przejmuje utrzymanie od tego momentu.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="a-co-z-or-priority-replication">A co z &quot;OR Priority Replication&quot;?</h1>
<p>Nowa opcja: <strong>99,0% obiektów replikowanych w 15 minut</strong>, poparte SLA (dla tego samego kontynentu).</p>
<p><strong>Nie rozwiązuje problemu seedingu</strong> — SLA jawnie wyklucza &quot;Existing blob replication ... following a recent Replication Policy creation or update&quot; — czyli dokładnie nasz jednorazowy catch-up ~150M obiektów. Plan azcopy → OR nie traci na aktualności.</p>
<p><strong>Może mieć znaczenie po zakończeniu seedingu</strong> — SLA 99%/15 min dotyczy replikacji <em>nowych</em> zapisów (RPO, nie RTO).</p>
<p>Źródło: <a href="https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-priority-replication#sla-eligibility-and-exclusions">Object Replication Priority Replication — SLA eligibility and exclusions</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="25" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="or-priority-replication--dwa-zastrze%C5%BCenia">OR Priority Replication — dwa zastrzeżenia</h1>
<p><strong>Koszt</strong>: <strong>0,015 $/GB</strong> od całego nowego ingressu — ponad standardowe koszty transakcji/egress OR. Po wyłączeniu — billing trwa jeszcze 30 dni.</p>
<p>Gdyby liczyć od całego backfillu (przykładowo ~1 755 TB): <strong>1 755 TB × 1 024 GB/TB × 0,015 $/GB ≈ 26 957 $</strong> — jednorazowo, na sam ten metr. W praktyce nieopłacalne.</p>
<p><strong>Ograniczenie</strong>: tylko <strong>jedna</strong> polityka OR per konto źródłowe może mieć włączone Priority Replication (konto może mieć maks. dwie polityki OR w ogóle).</p>
<p>Źródła:<br />
<a href="https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-priority-replication#feature-pricing">Object Replication Priority Replication — Feature pricing</a><br />
<a href="https://azure.microsoft.com/en-us/pricing/details/storage/blobs/">Azure Blob Storage Pricing — Object Replication Priority Replication Prices</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="por%C3%B3wnanie-koszt%C3%B3w-replikacji-wolumen-magazynu-log%C3%B3w">Porównanie kosztów replikacji (wolumen magazynu logów)</h1>
<table>
<thead>
<tr>
<th>Podejście</th>
<th>Koszt dodatkowy/mies.</th>
</tr>
</thead>
<tbody>
<tr>
<td>Natywny GZRS (Hot w obu regionach)</td>
<td>7 809 $ – 12 473 $</td>
</tr>
<tr>
<td>Object Replication, warstwa Cool</td>
<td>6 501 $ – 9 669 $</td>
</tr>
<tr>
<td><strong>Object Replication, warstwa Cold</strong></td>
<td><strong>2 893 $ – 3 907 $</strong></td>
</tr>
</tbody>
</table>
<p><strong>Cold-tier Object Replication: 63–70% taniej niż natywny GZRS.</strong></p>
<p>Zawiera koszt Cold ZRS po stronie zapasowej plus bieżący egress między regionami (~1 196 $/mies. przy obecnym przyroście danych).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="27" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="cena-kt%C3%B3rej-nie-wida%C4%87-w-rachunku-miesi%C4%99cznym">Cena, której nie widać w rachunku miesięcznym</h1>
<p>Failover wymaga &quot;podgrzania&quot; danych <strong>Cold → Hot</strong> przed uruchomieniem klastra zapasowego.</p>
<p>Azure liczy to jako <strong>Data Retrieval</strong>: 0,03 $/GB.</p>
<table>
<thead>
<tr>
<th>Szacunek wolumenu</th>
<th>Koszt jednorazowy failoveru</th>
</tr>
</thead>
<tbody>
<tr>
<td>Niski (424 TB)</td>
<td>~14 430 $</td>
</tr>
<tr>
<td>Środkowy (672 TB)</td>
<td>~22 848 $</td>
</tr>
<tr>
<td>Wysoki (802 TB)</td>
<td>~27 251 $</td>
</tr>
</tbody>
</table>
<p><strong>To nie jest koszt miesięczny — to koszt jednego zdarzenia.</strong> Dopóki failovery są rzadkie, oszczędność z warstwy Cold i tak wygrywa.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="najwi%C4%99ksze-ryzyko-nie-jest-kosztowe--jest-czasowe">Największe ryzyko nie jest kosztowe — jest czasowe</h1>
<p>Object Replication kopiuje <strong>pliki</strong>. Nie odtwarza samo z siebie operacyjności platformy.</p>
<p>Platforma trzyma globalny katalog (lokalizacje segmentów, offsety, metadane) jako <strong>stan wewnętrzny klastra</strong>, nie jako gotowy indeks. Świeży klaster zapasowy musi ten katalog <strong>odbudować, skanując dane</strong> (&quot;digest&quot;) — czas tej operacji rośnie z liczbą plików segmentów, nie tylko z ich rozmiarem.</p>
<p>Kolejność failoveru: <strong>[Cold→Hot] → [digest]</strong> — sekwencyjnie, nie równolegle.</p>
<p><strong>Czas digestu przy milionach segmentów: nieznany. To większe ryzyko dla 8h RTO niż jakikolwiek koszt w tej prezentacji.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="meme" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="meme" data-marpit-pagination="29" style="--paginate:true;--class:meme;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34"><img src="meme-3.jpg" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="30" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="inne-ryzyka-kt%C3%B3re-zostawiam-otwarte">Inne ryzyka, które zostawiam otwarte</h1>
<table>
<thead>
<tr>
<th>Ryzyko</th>
<th>Opis</th>
</tr>
</thead>
<tbody>
<tr>
<td>Lokalny bufor (3h) vs. RPO (4h)</td>
<td>Margines tylko 1h na opóźnienie replikacji</td>
</tr>
<tr>
<td>Replikacja danych w kolejkach</td>

<p>Wszystkie wymagają zmierzenia przed wdrożeniem produkcyjnym.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="section" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" class="section" data-marpit-pagination="31" style="--paginate:true;--class:section;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="krok-4-czy-wszystkie-dane-zas%C5%82uguj%C4%85-na-t%C4%99-sam%C4%85-ochron%C4%99">Krok 4: czy wszystkie dane zasługują na tę samą ochronę?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="32" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="koncentracja-danych">Koncentracja danych</h1>
<p><strong>Mniej niż 15% wszystkich klientów odpowiada za ~95,8% całego wolumenu</strong>.</p>
<table>
<thead>
<tr>
<th>Opcja</th>
<th>Opis</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A — jednolita ochrona</strong></td>
<td>Ten sam RTO/RPO dla wszystkiego. Prostsze, ale koszt rośnie z wolumenem, nie z ważnością danych</td>
</tr>
<tr>
<td><strong>B — warstwy wg krytyczności</strong></td>
<td>Krytyczne/standardowe/best-effort. Nie chodzi o oszczędność — chodzi o elastyczność i kolejność wdrożenia</td>
</tr>
</tbody>
</table>
<p>Obecne założenie robocze: <strong>Opcja A</strong> — dla prostoty.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q" lang="C" data-marpit-pagination="33" style="--paginate:true;--theme:00j5ublrqdbelvegp8a5g6b9gykww4px2scm80pdcw42q;" data-marpit-pagination-total="34">
<h1 id="wnioski">Wnioski</h1>
<ol>
<li><strong>Najprostsza cyfra (9 926 $/mies. za GZRS) nie była problemem.</strong> Problem znalazłem w operacyjnej wykonalności — jak przenieść dane, które już tam są.</li>
<li><strong>Miary, nie założenia</strong> — z 5,25 roku do 27 dni, tym samym narzędziem, tylko inaczej skonfigurowanym.</li>
<li><strong>Tiering magazynu (Hot/Cold) obniża koszt bieżący o ~65%</strong>, ale przenosi koszt na jedno zdarzenie: failover.</li>
<li><strong>Koszt failoveru jest policzony. Czas failoveru — najważniejszą liczbę w całym projekcie — wymaga dopracowania.</strong></li>
</ol>
